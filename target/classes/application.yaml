spring:
  application:
    name: login

  datasource:
    url: jdbc:mysql://localhost:3306/login
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

server:
  port: 8081
  servlet:
    context-path: /api/v1

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY} # Clave secreta en Base64 (openssl rand -base64 32)
    token-expiration: ${JWT_TOKEN_EXPIRATION:600000} # 10 min expresado en milisegundos
